<script>
const APP_VERSION = "20261026.2211";
/* NexoSaldo — capa financiera (navegador). Paridad con nexosaldo/finance (Python).
 * Importes en CENTAVOS enteros; porcentajes en PUNTOS BÁSICOS (1 % = 100 bp);
 * cantidades en MILÉSIMAS (1 unidad = 1000). Divisiones exactas con BigInt y
 * redondeo HALF_UP. Ningún cálculo usa coma flotante sobre importes. */
const F = (() => {
  const B = (x) => BigInt(x);
  // a/b con redondeo half-up (simétrico respecto a cero). a,b enteros; b != 0.
  function rdiv(a, b) {
    a = B(a); b = B(b);
    if (b === 0n) throw new Error("División por cero");
    const neg = (a < 0n) !== (b < 0n);
    if (a < 0n) a = -a; if (b < 0n) b = -b;
    let q = a / b; const r = a - q * b;
    if (2n * r >= b) q += 1n;
    return Number(neg ? -q : q);
  }
  const mulDiv = (a, m, d) => rdiv(B(a) * B(m), d);

  // Texto -> entero escalado (sin float). "1,234.5" -> 123450 con scale 2.
  function parseScaled(str, scale) {
    if (str === null || str === undefined) return null;
    let s = String(str).trim().replace(/[\s,$%]/g, "");
    if (s === "") return null;
    if (!/^-?\d*(\.\d*)?$/.test(s) || s === "-" || s === ".") return NaN;
    const neg = s.startsWith("-"); if (neg) s = s.slice(1);
    let [ip, fp = ""] = s.split(".");
    ip = ip || "0";
    const extra = fp.slice(scale); fp = fp.slice(0, scale).padEnd(scale, "0");
    let v = B(ip) * 10n ** B(scale) + B(fp || "0");
    if (extra && Number(extra[0]) >= 5) v += 1n;
    return Number(neg ? -v : v);
  }
  const toCents = (s) => parseScaled(s, 2);
  const toBp = (s) => parseScaled(s, 2);
  const toMilli = (s) => parseScaled(s, 3);

  const fmtMoney = (c, cur = "USD") => {
    if (c === null || c === undefined || Number.isNaN(c)) return "—";
    const neg = c < 0; const a = Math.abs(c);
    const ip = Math.trunc(a / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const s = `$${ip}.${String(a % 100).padStart(2, "0")}`;
    return (neg ? "-" : "") + s;
  };
  const centsToInput = (c) => (c === null || c === undefined) ? "" :
    `${c < 0 ? "-" : ""}${Math.trunc(Math.abs(c) / 100)}.${String(Math.abs(c) % 100).padStart(2, "0")}`;
  const bpToInput = (bp) => (bp === null || bp === undefined) ? "" : centsToInput(bp).replace(/\.00$/, "");
  const milliToStr = (m) => { const i = Math.trunc(m / 1000), f = Math.abs(m % 1000);
    return f ? `${i}.${String(f).padStart(3, "0").replace(/0+$/, "")}` : String(i); };
  // porcentaje en bp de num/den (None si den == 0)
  const ratioBp = (num, den) => (den === 0 || den === null) ? null : mulDiv(num, 10000, den);
  const fmtPct = (bp, empty = "Sin base") => bp === null || bp === undefined ? empty : `${bpToInput(bp)} %`;
  const sum = (arr, f = (x) => x) => arr.reduce((t, x) => t + (f(x) || 0), 0);

  // ---------------------------------------------------------- presupuesto
  function budgetLight(budget, actual, warnBp = 8500, overBp = 10000) {
    if (!budget) return actual > 0 ? "rojo" : "sin";
    const ex = ratioBp(actual, budget);

let renderQueued = false, renderDeferred = false;

function errText(e) {
  const c = e && e.code;
  if (c === "invalid_argument") return "No tienes permiso para modificar estos datos o el registro no es válido.";
  if (c === "quota_exceeded") return "Se alcanzó el límite de almacenamiento del prototipo. Elimina registros de demostración.";
  if (c === "resource_exhausted") return "Demasiadas operaciones seguidas. Espera unos segundos e inténtalo de nuevo.";
  if (c === "unavailable") return "El almacenamiento no respondió. Inténtalo de nuevo.";
  return (e && e.message) || "No se pudo guardar.";
}
async function save(col, obj) {
  const { id, ...body } = obj; const clean = clone(body);
  if (!canWrite) { toast("Tu acceso es de solo lectura."); throw new Error("read-only"); }
  if (mode === "db") {
    try { await db.collection(col).doc(id).set(clean); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise((r) => setTimeout(r, 400 + Math.random() * 500));
        await db.collection(col).doc(id).set(clean); }
      else { toast(errText(e)); if (e && e.code === "invalid_argument") canWrite = false; throw e; }
    }
  }
  S[col][id] = { id, ...clean }; scheduleRender();
}
async function remove(col, id) {
  if (mode === "db") { try { await db.collection(col).doc(id).delete(); } catch (e) { toast(errText(e)); throw e; } }
  delete S[col][id]; scheduleRender();
}

async function initStore() {
  try { [db, downloads, assets, userCap] = await Promise.all(["db", "downloads", "assets", "user"].map((n) =>
    window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null))); }
  catch { db = null; }
  if (userCap) { try { const w = await userCap.can("data.write"); if (w === false) canWrite = false; } catch {} }
  if (!db) { mode = "memory"; render(); return; }
  mode = "db";
  COLS.forEach((c) => db.collection(c).onSnapshot((snap) => {
    const o = {}; snap.docs.forEach((d) => (o[d.id] = { id: d.id, ...d.data() }));
    S[c] = o; loaded.add(c); scheduleRender();
  }, (e) => { storeError = e; scheduleRender(); }));
}

const inR = (iso, R) => !!iso && iso >= R.from && iso <= R.to;

const evBudgetInitial = (ev) => F.sum(ev.budget || [], (b) => b.initialC);
// gasto reconocido del evento = gastos directos + porciones asignadas de gastos generales
function evExpenses(eid, R) {
  let t = 0;
  liveExp().forEach((e) => {
    if (R && !inR(e.date, R)) return;
    if (e.eventId === eid) t += e.amountC;
    else if (!e.eventId && e.allocations && e.allocations[eid]) t += e.allocations[eid];
  });
  return t;
}
function evExpByCat(eid) {
  const m = {};
  liveExp().forEach((e) => {
    const a = e.eventId === eid ? e.amountC : (!e.eventId && e.allocations && e.allocations[eid]) || 0;
    if (a) m[e.category] = (m[e.category] || 0) + a;
  });
  return m;
}
const evSales = (eid) => liveSales().filter((s) => s.eventId === eid);
const evRevenue = (eid) => F.sum(evSales(eid), (s) => s.netC);
const evInvoiced = (eid) => F.sum(evSales(eid), F.saleInvoiced);
const evCollected = (eid) => F.sum(evSales(eid), F.saleCollected);
const evQuotes = (eid) => all("quotes").filter((q) => q.eventId === eid);
const curVer = (q) => q.versions[q.versions.length - 1];
const acceptedVer = (q) => q.versions.find((v) => v.status === "aceptada");
function evQuoteEstimate(eid) {
  // la referencia es la versión aceptada; si no existe, la última emitida
  let best = null;
  evQuotes(eid).forEach((q) => {
    const v = acceptedVer(q) || [...q.versions].reverse().find((x) => x.status !== "borrador" && x.status !== "cancelada");
    if (v) { const s = F.computeQuote(v); if (!best || v.status === "aceptada") best = { q, v, s }; }
  });
  return best;
}
function evFacts(ev) {
  const revenue = evRevenue(ev.id), expenses = evExpenses(ev.id);
  return { ev, revenue, expenses, profit: revenue - expenses, marginBp: F.ratioBp(revenue - expenses, revenue),
    budget: evBudget(ev), invoiced: evInvoiced(ev.id), collected: evCollected(ev.id), est: evQuoteEstimate(ev.id),
    savings: !FEATURES.savings ? 0 : F.sum(all("savings").filter((m) => m.eventId === ev.id), (m) => (m.kind === "aporte" ? m.amountC : -m.amountC)) };
}
function savingsBalance(goalId, uptoISO) {
  return F.sum(all("savings").filter((m) => (!goalId || m.goalId === goalId) && (!uptoISO || m.date <= uptoISO)),
    (m) => (m.kind === "aporte" ? m.amountC : -m.amountC));
}
// Caja estimada: cobros − pagos de gastos − pagos a accionistas − ahorro reservado.
function cashAvailable(excludeSavings) {
  const inC = F.sum(liveSales(), F.saleCollected);
  const outExp = F.sum(liveExp(), expPaid);
  const outSh = F.sum(all("distributions").filter((d) => d.status === "aprobada"),
    (d) => F.sum(d.lines, (l) => F.sum(l.payments || [], (p) => p.amountC)));
  return inC - outExp - outSh - (excludeSavings || !FEATURES.savings ? 0 : savingsBalance());
}
function periodFacts(R, eid) {
  const sales = liveSales().filter((s) => (!eid || s.eventId === eid));
  const exps = liveExp();
  const revenue = F.sum(sales.filter((s) => inR(s.date, R)), (s) => s.netC);
  const expenses = eid ? evExpenses(eid, R) : F.sum(exps.filter((e) => inR(e.date, R)), (e) => e.amountC);
  const collected = F.sum(sales, (s) => F.sum((s.receipts || []).filter((r) => !r.voided && inR(r.date, R)), (r) => r.amountC));
  const invoiced = F.sum(sales, (s) => F.sum((s.invoices || []).filter((i) => !i.voided && inR(i.date, R)), (i) => i.amountC));
  const receivable = F.sum(sales.filter((s) => s.date <= R.to), (s) => F.saleGross(s) - F.saleCollected(s));
  const evs = all("events").filter((e) => eid ? e.id === eid : inR(e.start, R));
  const budget = F.sum(evs, evBudget);
  const evExp = F.sum(evs, (e) => evExpenses(e.id));
  const payables = F.sum(exps.filter((e) => e.date <= R.to && (!eid || e.eventId === eid)), (e) => e.amountC - expPaid(e));
  const shOwed = eid ? 0 : F.sum(all("distributions").filter((d) => d.status === "aprobada"),
    (d) => F.sum(d.lines, (l) => l.amountC - F.sum(l.payments || [], (p) => p.amountC)));
  let quoted = 0, qAccepted = 0, qAcceptedC = 0, qPending = 0, qPendingC = 0, qIssued = 0, estProfit = 0;
  all("quotes").filter((q) => !eid || q.eventId === eid).forEach((q) => {
    const v = acceptedVer(q) || curVer(q);
    if (!v || v.status === "borrador" || v.status === "cancelada" || !inR(v.issuedOn, R)) return;
    const s = F.computeQuote(v); qIssued++; quoted += s.netC;
    if (v.status === "aceptada") { qAccepted++; qAcceptedC += s.netC; estProfit += s.profitC; }
    if (v.status === "emitida" || v.status === "enviada") { qPending++; qPendingC += s.netC; }
  });
  const savedIn = !FEATURES.savings ? 0 : F.sum(all("savings").filter((m) => inR(m.date, R) && (!eid || m.eventId === eid)),
    (m) => (m.kind === "aporte" ? m.amountC : -m.amountC));
  const profit = revenue - expenses;
  const dist = F.distributable(profit, Math.max(savedIn, 0));
  return { revenue, expenses, profit, marginBp: F.ratioBp(profit, revenue), collected, invoiced, receivable,
    budget, evExp, budgetBalance: budget - evExp, payables, shOwed, quoted, qIssued, qAccepted, qAcceptedC, qPending, qPendingC,
    estProfit, savedIn, savingsTotal: FEATURES.savings ? savingsBalance(null, R.to) : 0, available: dist.availableC,
    events: evs.length, active: evs.filter((e) => e.status === "planificado" || e.status === "en_ejecucion").length,
    finished: evs.filter((e) => e.status === "finalizado").length, cancelled: evs.filter((e) => e.status === "cancelado").length,
    evNames: new Set(evs.filter((e) => e.status !== "cancelado").map((e) => e.name.trim().toLowerCase())) };
}

// Reparte una ganancia según los porcentajes vigentes hoy. Ganancia negativa → nada que repartir.
function shareSplit(amountC) {
  const hs = F.effectiveHolders(all("shareholders"), todayISO()); if (!hs.length) return { none: true, lines: [] };
  const tot = F.sum(hs, (h) => h.bp);
  if (tot !== 10000) return { error: `Las participaciones suman ${F.bpToInput(tot)} %; deben sumar 100 %.`, lines: [] };
  return F.proposeDistribution(Math.max(amountC, 0), hs, todayISO());
}

function quotedJobs() {
  return all("quotes").map((q) => { const v = acceptedVer(q) || curVer(q); if (!v || ["rechazada", "vencida", "cancelada"].includes(v.status)) return null;
    const s = F.computeQuote(v); const sale = all("sales").find((x) => x.quoteId === q.id && !x.voided);

function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p;

// barras verticales agrupadas; admite negativos (eje en cero)
function barChart(labels, series, opts = {}) {
  const W = 420, H = opts.h || 230, pl = 50, pr = 8, pt = 10, pb = 26;
  const vals = series.flatMap((s) => s.values); const mx = niceMax(Math.max(0, ...vals)); const mnRaw = Math.min(0, ...vals);
  const mn = mnRaw < 0 ? -niceMax(-mnRaw) : 0; const span = mx - mn || 1;
  const y = (v) => pt + (H - pt - pb) * (mx - v) / span; const gw = (W - pl - pr) / labels.length;
  const bw = Math.max(4, Math.min(26, (gw - 10) / series.length - 2));
  let g = '<g class="grid">'; for (let i = 0; i <= 4; i++) { const v = mn + span * i / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${short(Math.round(v))}</text>`; } g += "</g>";
  let b = ""; labels.forEach((lb, i) => {
    const x0 = pl + gw * i + (gw - (bw + 2) * series.length + 2) / 2;
    series.forEach((s, j) => { const v = s.values[i]; const yy = Math.min(y(v), y(0)); const hh = Math.max(Math.abs(y(v) - y(0)), v ? 1.5 : 0);
      const col = opts.negColor && v < 0 ? opts.negColor : s.color; const x = x0 + j * (bw + 2);
      b += `<path d="${roundedBar(x, yy, bw, hh, v >= 0)}" fill="${col}"/><rect x="${x - 2}" y="${pt}" width="${bw + 4}" height="${H - pt - pb}" fill="transparent" data-tip="<b>${esc(lb)}</b><br>${esc(s.name)}: ${M(v)}"/>`; });
    b += `<text x="${pl + gw * i + gw / 2}" y="${H - 8}" text-anchor="middle">${esc(lb)}</text>`; });
  return `${legend(series)}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Gráfico")}">${g}<line class="axis" x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}"/>${b}</svg>`;
}
function roundedBar(x, y, w, h, up) { const r = Math.min(4, h, w / 2); if (h <= 0) return "";
  return up ? `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`
    : `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`; }
function lineChart(labels, values, color, label) {
  const W = 420, H = 210, pl = 50, pr = 28, pt = 12, pb = 26; const mx = niceMax(Math.max(0, ...values));
  const x = (i) => pl + (W - pl - pr) * (labels.length === 1 ? 0.5 : i / (labels.length - 1)); const y = (v) => pt + (H - pt - pb) * (1 - v / mx);
  let g = '<g class="grid">'; for (let i = 0; i <= 4; i++) { const v = mx * i / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`; } g += "</g>";
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(" ");

function resultView(e, f) {

  const rows = [
    ["Costo estimado al cotizar", s ? s.costTotalC : null], ["Presupuesto del cliente", f.budget || null], ["Gastos reales", f.expenses],

    ["Ingreso reconocido", f.revenue], ["Facturado", f.invoiced], ["Cobrado", f.collected],
    ["Ganancia estimada al cotizar", s ? s.profitC : null], ["Resultado real", f.profit]];
  const costVar = s ? f.expenses - s.costTotalC : null, priceVar = s ? f.revenue - s.netC : null, profitVar = s ? f.profit - s.profitC : null;
  const alerts = [];
  if (s && f.expenses > s.costTotalC) alerts.push(`Los gastos reales superan el costo estimado en ${M(f.expenses - s.costTotalC)}.`);
  if (f.budget && f.expenses > f.budget) alerts.push(`El costo real supera el presupuesto del cliente en ${M(f.expenses - f.budget)}.`);

}

    ${field(prefix + "d1", "Fecha del saldo", inp(prefix + "d1", addDays(iss, 30), 'type="date"'), "Si el anticipo es 100 %, no se usa")}`;
}
function scheduleFrom(d, prefix, totalC) {
  const bp = F.toBp(d[prefix + "pct"] || "100"); if (!(bp > 0 && bp <= 10000)) throw new Error("El anticipo debe estar entre 1 y 100 %.");
  const sch = [{ id: uid(), label: bp === 10000 ? "Pago total" : "Anticipo", pctBp: bp, due: d[prefix + "d0"] }];
  if (bp < 10000) sch.push({ id: uid(), label: "Saldo", pctBp: 10000 - bp, due: d[prefix + "d1"] });
  return F.scheduleAmounts(totalC, sch);
}

  const hs = F.effectiveHolders(all("shareholders"), todayISO()); const jobs = quotedJobs();
  if (!hs.length) return "";
  const head = `<div class="spread"><h2>Reparto por trabajo cotizado</h2><span class="small muted">Lo que le tocaría a cada accionista de la ganancia de cada trabajo</span></div>`;
  const chk = shareSplit(0); if (chk.error) return `<div class="card">${head}<div class="banner err">${esc(chk.error)} Ajusta los porcentajes para ver el reparto.</div></div>`;
  if (!jobs.length) return `<div class="card">${head}<p class="muted small">Todavía no hay cotizaciones. Cuando cotices un trabajo verás aquí cuánto le toca a cada accionista.</p></div>`;
  const rows = jobs.map((j) => ({ j, sp: shareSplit(j.gainC) }));
  const totals = hs.map((h) => F.sum(rows, (r) => (r.sp.lines.find((l) => l.shId === h.id) || {}).amountC || 0));
  const stLbl = (j) => j.isReal ? pill("good", "Real") : j.v.status === "aceptada" ? pill("good", "Aceptada") : j.v.status === "borrador" ? pill("", "Borrador") : pill("warn", "Pendiente");
  return `<div class="card">${head}
    <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Trabajo</th><th>Estado</th><th class="n">Ganancia</th>${hs.map((h) => `<th class="n">${esc(h.name)}<br><span class="small">${F.bpToInput(h.bp)} %</span></th>`).join("")}</tr></thead><tbody>
    ${rows.map(({ j, sp }) => `<tr class="click" data-act="open-quote" data-id="${j.q.id}"><td><b>${esc(j.ev ? j.ev.name : j.v.client.name || j.q.number)}</b><br><span class="small muted">${esc(j.q.number)} · ${fmtDate(j.v.issuedOn)}</span></td>
      <td>${stLbl(j)}</td><td class="n ${j.gainC < 0 ? "neg" : ""}">${M(j.gainC)}</td>${hs.map((h) => `<td class="n">${M((sp.lines.find((l) => l.shId === h.id) || {}).amountC || 0)}</td>`).join("")}</tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="2">Total</td><td class="n">${M(F.sum(rows, (r) => Math.max(r.j.gainC, 0)))}</td>${totals.map((t) => `<td class="n">${M(t)}</td>`).join("")}</tr></tfoot></table></div>
    <p class="small muted" style="margin-top:8px">«Real» usa lo vendido menos los gastos registrados del evento; las demás usan la ganancia estimada de la cotización. Es una referencia: el dinero se reparte al aprobar una distribución abajo.</p></div>`;
}
/* ===================================================== arranque y eventos */
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.disabled) return;
  try { await fn(el, ev); } catch (e) { if (e && e.message !== "read-only") { console.error(e); toast(errText(e)); } }
});
document.addEventListener("submit", async (ev) => {
  const f = ev.target; ev.preventDefault(); const fn = SUBMIT[f.id]; if (!fn) return;
  const b = f.querySelector('button.pri, button[type="submit"]'); if (b) b.disabled = true;
  try { await fn(f); } catch (e) { if (e && e.message !== "read-only") { console.error(e); formErr(f, errText(e)); } }
  finally { if (b && document.body.contains(b)) b.disabled = false; }
});
function onChange(ev) {
  const el = ev.target;
  if (el.dataset.q !== undefined || el.dataset.l !== undefined || el.dataset.qs !== undefined) { onQuoteInput(el); return; }
  if (ev.type !== "change" && el.dataset.chg !== "exp-filter") return;
  if (el.dataset.qtax !== undefined) return CHG.qtax(el);
  if (el.dataset.qev) return CHG.qev(el);
  if (el.dataset.chg && CHG[el.dataset.chg]) CHG[el.dataset.chg](el);
}
document.addEventListener("input", onChange);
document.addEventListener("change", onChange);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.getElementById("modal").hidden) closeModal(); });
render();
initStore();

</script>
